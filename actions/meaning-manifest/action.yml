name: "ĀML Meaning Manifest Gate"
description: "Verify a committed project-level AML Meaning Manifest and fail when compiled meaning drifts."
inputs:
  manifest-file:
    description: "Path to the committed AML Meaning Manifest JSON"
    required: false
    default: "aml-meaning-lock.json"
runs:
  using: "composite"
  steps:
    - shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/../../bin/aml-meaning.js" \
          verify-manifest \
          "${{ inputs.manifest-file }}"
branding:
  icon: "layers"
  color: "purple"
