name: "ĀML Meaning Lock"
description: "Fail CI when two AML files no longer compile to the same Abstract Meaning Tree meaning fingerprint."
inputs:
  before-file:
    description: "Path to the baseline .aml file"
    required: true
  after-file:
    description: "Path to the proposed .aml file"
    required: true
runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        AML_BEFORE_FILE: ${{ inputs.before-file }}
        AML_AFTER_FILE: ${{ inputs.after-file }}
      run: |
        set -euo pipefail
        node "$GITHUB_ACTION_PATH/../../bin/aml-meaning.js" "$AML_BEFORE_FILE" "$AML_AFTER_FILE"
branding:
  icon: "lock"
  color: "purple"
