name: "Verify Official ĀML"
description: "Verify an AML brand authorization credential against the canonical or supplied ĀRU trust-root registry."
inputs:
  credential-file:
    description: "Path to an aml-brand-authorization/1 credential JSON file in the caller workspace"
    required: true
  trust-roots-file:
    description: "Optional trust-root registry path. Defaults to the canonical BRAND_TRUST_ROOTS.json shipped with this action revision."
    required: false
    default: ""
  revocation-file:
    description: "Optional AML revocation-registry JSON path"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - shell: bash
      run: |
        TRUST_ROOTS="${{ inputs.trust-roots-file }}"
        if [ -z "$TRUST_ROOTS" ]; then
          TRUST_ROOTS="$GITHUB_ACTION_PATH/../../BRAND_TRUST_ROOTS.json"
        fi

        if [ -n "${{ inputs.revocation-file }}" ]; then
          node "$GITHUB_ACTION_PATH/../../bin/aml-brand-verify.js" \
            "${{ inputs.credential-file }}" \
            "$TRUST_ROOTS" \
            "${{ inputs.revocation-file }}"
        else
          node "$GITHUB_ACTION_PATH/../../bin/aml-brand-verify.js" \
            "${{ inputs.credential-file }}" \
            "$TRUST_ROOTS"
        fi
branding:
  icon: "verified"
  color: "green"
