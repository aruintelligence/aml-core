name: "ĀML Meaning Gate"
description: "Fail CI when AML changes introduce high-risk semantic changes or policy regressions."
inputs:
  before-file:
    description: "Path to the baseline .aml file"
    required: true
  after-file:
    description: "Path to the proposed .aml file"
    required: true
  before-policy:
    description: "Baseline policy/profile"
    required: false
    default: "calm_default"
  after-policy:
    description: "Proposed enforcement policy/profile"
    required: false
    default: "human_first"
  context-file:
    description: "Optional runtime context JSON path"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        AML_BEFORE_FILE: ${{ inputs.before-file }}
        AML_AFTER_FILE: ${{ inputs.after-file }}
        AML_BEFORE_POLICY: ${{ inputs.before-policy }}
        AML_AFTER_POLICY: ${{ inputs.after-policy }}
        AML_CONTEXT_FILE: ${{ inputs.context-file }}
      run: |
        set -euo pipefail
        ARGS=("$AML_BEFORE_FILE" "$AML_AFTER_FILE" "$AML_BEFORE_POLICY" "$AML_AFTER_POLICY")
        if [ -n "$AML_CONTEXT_FILE" ]; then ARGS+=("$AML_CONTEXT_FILE"); fi
        node "$GITHUB_ACTION_PATH/../../scripts/meaning-gate.js" "${ARGS[@]}"
branding:
  icon: "shield"
  color: "blue"
