name: AML Action Boundary Vectors

on:
  push:
    paths:
      - "pilots/action-boundary/**"
      - "protocol/canonicalJson.js"
      - "docs/action-dispatch-matrix.json"
      - "docs/action-dispatch-mutants.json"
      - "docs/dispatch-matrix.html"
      - "docs/dispatch-matrix.js"
      - "test/action-boundary-dispatch-matrix.test.js"
      - "test/action-boundary-mutation-proof.test.js"
      - "test/dispatch-matrix-view.test.js"
      - ".github/workflows/action-boundary-vectors.yml"
  pull_request:
    paths:
      - "pilots/action-boundary/**"
      - "protocol/canonicalJson.js"
      - "docs/action-dispatch-matrix.json"
      - "docs/action-dispatch-mutants.json"
      - "docs/dispatch-matrix.html"
      - "docs/dispatch-matrix.js"
      - "test/action-boundary-dispatch-matrix.test.js"
      - "test/action-boundary-mutation-proof.test.js"
      - "test/dispatch-matrix-view.test.js"
      - ".github/workflows/action-boundary-vectors.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node pilots/action-boundary/boundary.test.mjs
      - run: node pilots/action-boundary/vectors.test.mjs
      - run: python3 pilots/action-boundary/verify_vectors.py
      - run: node pilots/action-boundary/dispatch-matrix.mjs --check
      - run: python3 pilots/action-boundary/verify_dispatch_matrix.py docs/action-dispatch-matrix.json
      - run: node pilots/action-boundary/dispatch-mutants.mjs --check
      - run: node --test test/action-boundary-dispatch-matrix.test.js
      - run: node --test test/action-boundary-mutation-proof.test.js
      - run: node --test test/dispatch-matrix-view.test.js
