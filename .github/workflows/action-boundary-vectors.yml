name: AML Action Boundary Vectors

on:
  push:
    paths:
      - "pilots/action-boundary/**"
      - "protocol/canonicalJson.js"
      - "docs/action-dispatch-matrix.json"
      - "docs/action-policy-tuple.json"
      - "docs/action-snapshot-proof.json"
      - "docs/action-dispatch-mutants.json"
      - "docs/dispatch-matrix.html"
      - "docs/dispatch-matrix.js"
      - "docs/policy-tuple.html"
      - "docs/policy-tuple.js"
      - "docs/snapshot-binding.html"
      - "docs/snapshot-binding.js"
      - "test/action-boundary-dispatch-matrix.test.js"
      - "test/action-boundary-policy-tuple.test.js"
      - "test/action-boundary-snapshot-proof.test.js"
      - "test/action-boundary-mutation-proof.test.js"
      - "test/dispatch-matrix-view.test.js"
      - "test/policy-tuple-view.test.js"
      - "test/snapshot-binding-view.test.js"
      - ".github/workflows/action-boundary-vectors.yml"
  pull_request:
    paths:
      - "pilots/action-boundary/**"
      - "protocol/canonicalJson.js"
      - "docs/action-dispatch-matrix.json"
      - "docs/action-policy-tuple.json"
      - "docs/action-snapshot-proof.json"
      - "docs/action-dispatch-mutants.json"
      - "docs/dispatch-matrix.html"
      - "docs/dispatch-matrix.js"
      - "docs/policy-tuple.html"
      - "docs/policy-tuple.js"
      - "docs/snapshot-binding.html"
      - "docs/snapshot-binding.js"
      - "test/action-boundary-dispatch-matrix.test.js"
      - "test/action-boundary-policy-tuple.test.js"
      - "test/action-boundary-snapshot-proof.test.js"
      - "test/action-boundary-mutation-proof.test.js"
      - "test/dispatch-matrix-view.test.js"
      - "test/policy-tuple-view.test.js"
      - "test/snapshot-binding-view.test.js"
      - ".github/workflows/action-boundary-vectors.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: node pilots/action-boundary/boundary.test.mjs
      - run: node pilots/action-boundary/vectors.test.mjs
      - run: python3 pilots/action-boundary/verify_vectors.py
      - run: node pilots/action-boundary/dispatch-matrix.mjs --check
      - run: python3 pilots/action-boundary/verify_dispatch_matrix.py docs/action-dispatch-matrix.json
      - run: node pilots/action-boundary/policy-tuple.mjs --check
      - run: python3 pilots/action-boundary/verify_policy_tuple.py docs/action-policy-tuple.json
      - run: node pilots/action-boundary/snapshot-proof.mjs --check
      - run: python3 pilots/action-boundary/verify_snapshot_proof.py docs/action-snapshot-proof.json
      - run: node pilots/action-boundary/dispatch-mutants.mjs --check
      - run: node --test test/action-boundary-dispatch-matrix.test.js
      - run: node --test test/action-boundary-policy-tuple.test.js
      - run: node --test test/action-boundary-snapshot-proof.test.js
      - run: node --test test/action-boundary-mutation-proof.test.js
      - run: node --test test/dispatch-matrix-view.test.js
      - run: node --test test/policy-tuple-view.test.js
      - run: node --test test/snapshot-binding-view.test.js
