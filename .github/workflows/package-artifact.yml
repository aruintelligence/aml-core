name: AML Package Artifact

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install package metadata
        run: npm install --ignore-scripts
      - name: Audit installable package artifact
        run: node scripts/check-package-artifact.mjs
      - name: Probe live npm package identity
        run: node scripts/check-npm-identity.mjs --allow-unpublished --soft-unavailable
