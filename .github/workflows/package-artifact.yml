name: AML Package Artifact

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install package metadata
        run: npm install --ignore-scripts
      - name: Audit and build installable package artifact
        run: node scripts/build-package-artifact.mjs artifacts/npm
      - name: Probe live npm package identity
        run: node scripts/check-npm-identity.mjs --allow-unpublished --soft-unavailable
      - name: Upload exact audited npm artifact
        uses: actions/upload-artifact@v4
        with:
          name: aml-core-npm-${{ github.sha }}
          path: artifacts/npm/
          if-no-files-found: error
          retention-days: 14
