name: AML Package Artifact

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
      - name: Install package metadata
        run: npm install --ignore-scripts
      - name: Audit and build installable package artifact
        run: node scripts/build-package-artifact.mjs artifacts/npm
      - name: Probe live npm package identity
        run: node scripts/check-npm-identity.mjs --allow-unpublished --soft-unavailable
      - name: Upload exact audited npm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: aml-core-npm-${{ github.sha }}
          path: artifacts/npm/
          if-no-files-found: error
          retention-days: 14
