name: AML Signed Checkpoints and Witness Receipts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint-witness-control-plane:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify signed checkpoints, succession, and witness receipts
        run: node scripts/check-checkpoint-witness-control-plane.mjs | tee aml-checkpoint-witness-report.json
      - name: Upload checkpoint witness report
        uses: actions/upload-artifact@v4
        with:
          name: aml-checkpoint-witness-report
          path: aml-checkpoint-witness-report.json
          if-no-files-found: error
