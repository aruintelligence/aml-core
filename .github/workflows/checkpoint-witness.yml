name: AML Signed Checkpoints and Witness Receipts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint-witness-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
      - name: Verify signed checkpoints, succession, and witness receipts
        run: node scripts/check-checkpoint-witness-control-plane.mjs | tee aml-checkpoint-witness-report.json
      - name: Upload checkpoint witness report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: aml-checkpoint-witness-report
          path: aml-checkpoint-witness-report.json
          if-no-files-found: error
