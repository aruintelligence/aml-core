name: AML Multi-Witness Consistency

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  multi-witness-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
      - name: Verify multi-witness quorum and split-view rejection
        run: node scripts/check-multi-witness-consistency.mjs aml-multi-witness-consistency-report.json
      - name: Upload consistency report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: aml-multi-witness-consistency-report
          path: aml-multi-witness-consistency-report.json
          if-no-files-found: error
