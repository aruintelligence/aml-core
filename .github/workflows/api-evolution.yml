name: AML API Evolution

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api-evolution:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify protected API evolution contract
        run: node scripts/check-api-evolution.mjs
      - name: Verify runtime and TypeScript protected surface
        run: node scripts/check-api-stability.mjs
