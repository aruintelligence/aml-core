name: Browser action observation

on:
  push:
    branches: [main]
    paths:
      - "docs/evidence/aml-action-browser-100.*"
      - "scripts/verify-action-browser-observation.mjs"
      - "test/action-browser-observation.test.js"
      - ".github/workflows/action-browser-observation.yml"
  pull_request:
    paths:
      - "docs/evidence/aml-action-browser-100.*"
      - "scripts/verify-action-browser-observation.mjs"
      - "test/action-browser-observation.test.js"
      - ".github/workflows/action-browser-observation.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: Check browser observation and tamper rejection
        run: |
          node scripts/verify-action-browser-observation.mjs
          node --test test/action-browser-observation.test.js
