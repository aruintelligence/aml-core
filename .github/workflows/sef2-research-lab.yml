name: AML SEF2 Synthetic Crash and Recovery Lab

on:
  pull_request:
    paths:
      - 'research/sef2/**'
      - '.github/workflows/sef2-research-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sef2-adversarial:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact checkout SHA
        run: git rev-parse HEAD
      - name: Install pinned cryptographic dependency
        run: python3 -m pip install cryptography==46.0.3
      - name: Compile fixture and tests
        run: python3 -m compileall -q research/sef2
      - name: Execute synthetic-only adversarial and recovery suite
        working-directory: research/sef2
        run: python3 -W error::ResourceWarning -m unittest -v test_sef2 test_receipt test_witness_chain test_pinned_witness test_durable_witness test_signed_receipt test_evidence_gate test_evaluation_kit test_observer_process test_origin_event test_observer_authenticated test_observer_pinned test_enterprise_bundle test_pinned_trust test_trust_enrollment test_enrolled_bundle test_signed_history test_historical_bundle test_checkpoint_council test_durable_quorum test_witness_freshness test_witness_http test_witness_process test_authenticated_publication test_live_enterprise_demo test_witness_recovery_controls test_durable_integrity test_external_witness_anchor test_pinned_service_process test_strict_pinned_live test_rotation_recovery test_pin_replication test_replica_attestation test_gated_action_broker test_broker_state_model test_fresh_replica_gate test_broker_socket test_broker_isolation_guard test_signer_policy test_signer_witness test_signer_witness_process test_byzantine_quorum test_witness_independence test_independent_quorum_gate test_witness_key_recovery test_witness_recovery_enrollment test_anchored_threshold_recovery test_threshold_recovery test_recovery_authority_evidence test_recovery_council_evidence test_session_capability test_session_capability_broker test_session_state_model test_broker_authenticated_holder test_session_signer_policy test_session_epoch_anchor test_session_epoch_anchor_broker test_session_revocation_model test_holder_proof_service test_authenticated_execution_challenge test_authenticated_holder_execution test_recovery_policy_rotation test_recovery_policy_rotation_model test_recovery_policy_registry test_recovery_anchor_quorum test_recovery_policy_registry_anchor test_recovery_ledger_reference_verifier test_recovery_anchor_reference_verifier test_recovery_evidence_reference_verifier test_recovery_state_model test_recovery_evidence_bundle test_recovery_current_policy_reference_verifier test_recovery_quorum_transparency_verifier test_recovery_complete_reference_verifier test_recovery_anchor_policy_rotation test_recovery_anchor_reenrollment test_recovery_anchor_reenrollment_verified test_recovery_anchor_rotation_model test_recovery_anchor_reconciliation test_remote_recovery_head_anchor
      - name: Benchmark local threshold recovery and independent anchor verification
        working-directory: research/sef2
        run: |
          python3 benchmark_recovery_authority.py --iterations 25
          python3 benchmark_recovery_evidence.py --iterations 25
      - name: Execute enterprise synthetic evaluation demo
        run: python3 research/sef2/evaluation_kit/demo.py
      - name: Produce and independently verify enterprise evaluation bundle
        run: |
          python3 research/sef2/evaluation_kit/enterprise_demo.py --output /tmp/aml-sef2-evaluation
          python3 research/sef2/evaluation_kit/verify_bundle.py --input /tmp/aml-sef2-evaluation
      - name: Execute signed-history live witness enterprise demonstration
        run: python3 research/sef2/evaluation_kit/live_enterprise_demo.py --output /tmp/aml-sef2-live-enterprise
      - name: Execute restart rollback fork and pin adversarial evidence
        run: python3 research/sef2/test_witness_recovery_controls.py --output /tmp/aml-sef2-witness-adversarial-report.json
      - name: Verify pinned trust-manifest adversarial suite
        run: python3 -m compileall -q research/sef2/evaluation_kit/verify_trusted.py


      - name: Disposable Linux separate-UID broker boundary
        run: |
          sudo useradd --system --no-create-home --user-group aml_broker_test
          sudo useradd --system --no-create-home --user-group aml_client_test
          sudo useradd --system --no-create-home --user-group aml_signer_test
          sudo useradd --system --no-create-home --user-group aml_witness_test
          sudo groupadd --system aml_session_clients
          sudo useradd --system --no-create-home --user-group aml_session_attacker_test
          sudo useradd --system --no-create-home --user-group aml_holder_test
          sudo useradd --system --no-create-home --user-group aml_epoch_anchor_test
          sudo useradd --system --no-create-home --user-group aml_ra0_test
          sudo useradd --system --no-create-home --user-group aml_ra1_test
          sudo useradd --system --no-create-home --user-group aml_ra2_test
          sudo useradd --system --no-create-home --user-group aml_ra3_test
          sudo python3 research/sef2/test_cross_uid_boundary.py
          sudo python3 research/sef2/test_full_broker_cross_uid.py
          sudo python3 research/sef2/test_signer_witness_process.py
          sudo python3 research/sef2/test_recovery_head_anchor_process.py
          sudo python3 research/sef2/test_session_broker_cross_uid.py
          sudo python3 research/sef2/test_session_holder_process.py
          sudo python3 research/sef2/test_session_holder_pid_process.py
          sudo python3 research/sef2/test_broker_authenticated_holder_process.py
          sudo python3 research/sef2/test_holder_proof_service_process.py
          sudo python3 research/sef2/test_session_epoch_anchor_process.py
