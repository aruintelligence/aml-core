name: AML SEF2 Synthetic Crash and Recovery Lab

on:
  pull_request:
    paths:
      - 'research/sef2/**'
      - '.github/workflows/sef2-research-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sef2-adversarial:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact checkout SHA
        run: git rev-parse HEAD
      - name: Install pinned cryptographic dependency
        run: python3 -m pip install cryptography==46.0.3
      - name: Compile fixture and tests
        run: python3 -m compileall -q research/sef2
      - name: Execute synthetic-only adversarial and recovery suite
        working-directory: research/sef2
        run: python3 -W error::ResourceWarning -m unittest -v test_sef2 test_receipt test_witness_chain test_pinned_witness test_durable_witness test_signed_receipt test_evidence_gate test_evaluation_kit test_observer_process test_origin_event test_observer_authenticated
      - name: Execute enterprise synthetic evaluation demo
        run: python3 research/sef2/evaluation_kit/demo.py
