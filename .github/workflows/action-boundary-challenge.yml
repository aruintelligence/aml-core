      - "actions/action-boundary-conformance/**"
      - ".github/workflows/action-boundary-challenge.yml"

permissions:
  contents: read

jobs:
  challenge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check harness and rejection behavior
        run: node --test test/action-boundary-challenge.test.js
      - name: Verify portable visual report, scope labels, and hostile text escaping
        run: |
          node --test test/action-challenge-visual-report.test.js
          node --test test/action-challenge-summary.test.js
          node scripts/build-action-challenge-visual-example.mjs --check
      - name: Verify function-tool adapter
        run: |
          node --test test/action-boundary-guarded-tool.test.js
          node pilots/action-boundary/guarded-tool-demo.mjs > "$RUNNER_TEMP/aml-guarded-tool-demo.json"
      - name: Verify policy-scope counterexample and published visual report
        run: |
          node --test test/action-boundary-policy-scope.test.js
          node scripts/build-action-policy-scope-report.mjs --check
      - name: Verify portable Studio bundle and browser calculation parity
        run: |
          node --test test/action-studio-bundle.test.js
          node scripts/build-action-studio-example.mjs --check
          node scripts/verify-action-studio-bundle.mjs examples/action-studio/changed-destination.json
      - name: Verify A2UI v1.0 function gate and published visual cases
        run: |
          node --test test/action-boundary-a2ui-gate.test.js
          node pilots/action-boundary/a2ui-function-demo.mjs > "$RUNNER_TEMP/aml-a2ui-function-demo.json"
          node scripts/build-a2ui-function-report.mjs --check
          node scripts/build-a2ui-invocation-replay-report.mjs --check
      - name: Project-owned self-test
        run: node scripts/run-action-boundary-challenge.mjs --self-test
      - name: Exercise black-box process contract
        run: node scripts/run-action-boundary-challenge.mjs -- node pilots/action-boundary/challenge-reference-adapter.mjs
      - name: Verify the separate Python implementation and visual report
        run: |
          python3 -m unittest discover -s test -p test_python_boundary.py
          node scripts/run-action-boundary-challenge.mjs -- python3 pilots/action-boundary/challenge-python-adapter.py
          node scripts/build-action-cross-runtime-report.mjs --check
          node scripts/build-action-key-order-report.mjs --check
      - name: Verify host-owned dispatch ledger and recorded process race
        run: |
          node --test test/action-boundary-dispatch-ledger.test.js
          node scripts/build-file-dispatch-report.mjs --check
      - name: Verify private grant storage and historical replay regression
        run: |
          node --test test/action-boundary-file-grant.test.js
          node scripts/build-grant-directory-report.mjs --check
      - name: Prepare caller-owned executable wrapper
        run: |
          printf '%s\n' '#!/bin/sh' 'exec node "$GITHUB_WORKSPACE/pilots/action-boundary/challenge-reference-adapter.mjs" "$@"' > "$RUNNER_TEMP/aml-reference-adapter"
          chmod +x "$RUNNER_TEMP/aml-reference-adapter"
      - id: composite
        uses: ./actions/action-boundary-conformance
        with:
          adapter-command: ${{ runner.temp }}/aml-reference-adapter
      - name: Check composite outputs
        run: |
          test "${{ steps.composite.outputs.passed }}" = true
          test -s "${{ steps.composite.outputs.html-file }}"
          test -n "${{ steps.composite.outputs.artifact-url }}"
          node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync(process.argv[1])); if (r.project_reference_self_test || !r.passed || r.cases.length !== 13) process.exit(1)' "${{ steps.composite.outputs.result-file }}"
      - name: Prepare deliberately failing adapter
        run: |
          printf '%s\n' '#!/bin/sh' 'printf "{}"' > "$RUNNER_TEMP/aml-failing-adapter"
          chmod +x "$RUNNER_TEMP/aml-failing-adapter"
      - id: composite_failure
        continue-on-error: true
        uses: ./actions/action-boundary-conformance
        with:
          adapter-command: ${{ runner.temp }}/aml-failing-adapter
      - name: Check failed run retained both reports and a truthful verdict
        run: |
          test "${{ steps.composite_failure.outcome }}" = failure
          test "${{ steps.composite_failure.outputs.passed }}" = false
          test -s "${{ steps.composite_failure.outputs.html-file }}"
          test -n "${{ steps.composite_failure.outputs.artifact-url }}"
          node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync(process.argv[1])); if (r.passed || r.cases.length !== 13 || !r.cases[0].failures.length) process.exit(1)' "${{ steps.composite_failure.outputs.result-file }}"
