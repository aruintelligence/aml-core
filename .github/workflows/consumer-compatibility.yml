name: AML Consumer Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify package surface contract
        run: node scripts/check-package-surface.mjs
      - name: Clean consumer install and runtime smoke test
        run: node scripts/check-consumer-compatibility.mjs

  stable-quickstart:
    strategy:
      fail-fast: false
      matrix:
        node: [18, 24]
    runs-on: ubuntu-latest
    steps:
      - name: Check out current consumer example
        uses: actions/checkout@v4
        with:
          path: current
      - name: Check out exact stable v1.3.0 commit
        uses: actions/checkout@v4
        with:
          ref: 7c5f2ad4008fb62f6f80fac39e8e8926fdd80711
          path: stable
      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Rehearse stable tarball from a clean consumer directory
        shell: bash
        run: |
          (cd stable && npm pack --ignore-scripts)
          sha256sum stable/aml-core-1.3.0.tgz
          mkdir consumer
          cd consumer
          npm init -y
          npm install --ignore-scripts ../stable/aml-core-1.3.0.tgz
          cp ../current/examples/consumer/quickstart.mjs quickstart.mjs
          node quickstart.mjs
          npm exec -- aml execute intent.json calm_default context.json cli-receipt.json
          npm exec -- aml verify-receipt cli-receipt.json
