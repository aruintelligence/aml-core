name: AML Release Readiness Bundle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
      - name: Generate release-readiness bundle
        run: node scripts/release-readiness-bundle.mjs "${RUNNER_TEMP}/aml-release-readiness.json"
      - name: Regenerate and verify deterministic output
        run: |
          node scripts/release-readiness-bundle.mjs "${RUNNER_TEMP}/aml-release-readiness-2.json"
          cmp "${RUNNER_TEMP}/aml-release-readiness.json" "${RUNNER_TEMP}/aml-release-readiness-2.json"
      - name: Upload release-readiness bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: aml-release-readiness
          path: ${{ runner.temp }}/aml-release-readiness.json
