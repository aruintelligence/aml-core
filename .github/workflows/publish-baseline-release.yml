name: Publish AML release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-baseline-release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Publish v1.4.0-rc.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v1.4.0-rc.1" >/dev/null 2>&1; then
            echo "Release v1.4.0-rc.1 already exists."
          else
            gh release create "v1.4.0-rc.1" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "ĀML Core 1.4.0-rc.1 — Federated Trust & Mainstream Adoption Preview" \
              --notes-file "RELEASE_NOTES_1.4.0_RC1.md"
          fi
