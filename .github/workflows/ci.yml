name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install package metadata
        run: npm install --ignore-scripts
      - name: Run automated tests
        run: npm test
      - name: Verify CLI compilation
        run: node bin/aml.js compile examples/transmission-061.aml "${RUNNER_TEMP}/aml-dist"
