name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Install package metadata
        run: npm install --ignore-scripts
      - name: Check local documentation links
        run: npm run check:links
      - name: Run automated tests
        run: npm test
      - name: Prove deterministic receipt replay
        run: node demos/undeniable-proof/replay-proof.mjs > "${RUNNER_TEMP}/aml-replay-proof.json"
      - name: Verify five ALLOW and five SUPPRESS fixtures
        run: node scripts/check-flood-fixtures.js > "${RUNNER_TEMP}/aml-flood-fixtures.json"
      - name: Guard public proof surfaces
        run: node scripts/check-proof-surfaces.mjs > "${RUNNER_TEMP}/aml-proof-surfaces.json"
      - name: Enforce external witness registry integrity
        run: node scripts/check-witness-registry.mjs > "${RUNNER_TEMP}/aml-witness-registry.json"
      - name: Verify cross-language canonicalization vectors in Python
        run: python3 independent/python/check_canonical_vectors.py > "${RUNNER_TEMP}/aml-python-canonicalization.json"
      - name: Verify dependency-free Python witness vector
        run: python3 independent/python/verify_witness.py independent/python/witness-vector.json --now 2030-01-01T00:05:00Z > "${RUNNER_TEMP}/aml-python-witness.json"
      - name: Run black-box conformance against Python verifier
        run: node scripts/run-verifier-conformance.mjs -- python3 independent/python/verify_witness.py > "${RUNNER_TEMP}/aml-python-verifier-conformance.json"
      - name: Run black-box conformance against Go verifier
        run: node scripts/run-verifier-conformance.mjs -- bash independent/go/verify.sh > "${RUNNER_TEMP}/aml-go-verifier-conformance.json"
      - name: Verify Python witness tamper rejection
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, tempfile
          source = pathlib.Path('independent/python/witness-vector.json')
          bundle = json.loads(source.read_text(encoding='utf-8'))
          bundle['evidence']['receipt']['decisions'][0]['purpose'] = 'tampered-in-ci'
          target = pathlib.Path(tempfile.gettempdir()) / 'aml-tampered-witness.json'
          target.write_text(json.dumps(bundle), encoding='utf-8')
          result = subprocess.run([
              'python3', 'independent/python/verify_witness.py', str(target),
              '--now', '2030-01-01T00:05:00Z'
          ], capture_output=True, text=True)
          if result.returncode == 0:
              raise SystemExit('tampered witness unexpectedly verified')
          print(result.stdout)
          PY
      - name: Verify CLI compilation
        run: node bin/aml.js compile examples/transmission-061.aml "${RUNNER_TEMP}/aml-dist"
      - name: Verify compiled bundle integrity
        run: node bin/aml.js verify "${RUNNER_TEMP}/aml-dist/build_manifest.json"
      - name: Verify in-memory validation
        run: node bin/aml.js validate examples/ai_assistant_response.aml
      - name: Verify semantic lint
        run: node bin/aml.js lint examples/simple.aml
      - name: Verify explanation output
        run: node bin/aml.js explain examples/simple.aml > "${RUNNER_TEMP}/aml-explain.json"
      - name: Verify inspectable decision output
        run: node bin/aml.js inspect examples/accessibility_first.aml > "${RUNNER_TEMP}/aml-inspect.json"
      - name: Verify benchmark harness
        run: AML_BENCH_ITERATIONS=25 npm run benchmark > "${RUNNER_TEMP}/aml-benchmark.json"
