name: AML Package Reproducibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
      - name: Generate package content manifest
        run: node scripts/package-content-manifest.mjs "${RUNNER_TEMP}/aml-package-content-manifest.json"
      - name: Verify repeated package selection is deterministic
        run: node scripts/check-package-reproducibility.mjs
      - name: Upload package content manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: aml-package-content-manifest
          path: ${{ runner.temp }}/aml-package-content-manifest.json
