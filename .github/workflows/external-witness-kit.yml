name: AML External Witness Kit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  witness-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
      - name: Verify external witness kit
        run: node scripts/check-external-witness-kit.mjs > aml-external-witness-kit-check.json
      - name: Build reproducible witness kit
        run: node scripts/build-external-witness-kit.mjs dist/external-witness-kit
      - name: Assert no private signing material is bundled
        shell: bash
        run: |
          if grep -R --line-number --fixed-strings 'BEGIN PRIVATE KEY' dist/external-witness-kit; then
            echo 'Private key material found in external witness kit' >&2
            exit 1
          fi
      - name: Upload witness kit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: aml-external-witness-kit
          path: |
            dist/external-witness-kit
            aml-external-witness-kit-check.json
