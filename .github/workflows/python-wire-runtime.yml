name: AML Python Wire Runtime

on:
  push:
    branches: [main]
    paths:
      - "independent/python/wire_runtime.py"
      - "independent/python/WIRE_RUNTIME.md"
      - "scripts/check-python-wire-runtime.mjs"
      - "independent/python/verify_evidence_capsule.py"
      - "scripts/check-evidence-capsule-python.mjs"
      - "independent/python/verify_evidence_archive.py"
      - "scripts/check-evidence-archive-python.mjs"
      - "scripts/check-evidence-archive-vector.mjs"
      - "independent/python/verify_evidence_migration.py"
      - "scripts/check-evidence-migration-python.mjs"
      - "scripts/check-evidence-migration-vector.mjs"
      - "independent/vectors/migration-v1/**"
      - "runtime/evidenceMigration.js"
      - "docs/EVIDENCE_MIGRATION.md"
      - "independent/vectors/archive-v1/**"
      - "runtime/evidenceArchive.js"
      - "runtime/evidenceRenewal.js"
      - "docs/EVIDENCE_ARCHIVE.md"
      - "runtime/evidenceCapsule.js"
      - "docs/EVIDENCE_CAPSULE.md"
      - ".github/workflows/python-wire-runtime.yml"
  pull_request:
    branches: [main]
    paths:
      - "independent/python/wire_runtime.py"
      - "independent/python/WIRE_RUNTIME.md"
      - "scripts/check-python-wire-runtime.mjs"
      - "independent/python/verify_evidence_capsule.py"
      - "scripts/check-evidence-capsule-python.mjs"
      - "independent/python/verify_evidence_archive.py"
      - "scripts/check-evidence-archive-python.mjs"
      - "scripts/check-evidence-archive-vector.mjs"
      - "independent/python/verify_evidence_migration.py"
      - "scripts/check-evidence-migration-python.mjs"
      - "scripts/check-evidence-migration-vector.mjs"
      - "independent/vectors/migration-v1/**"
      - "runtime/evidenceMigration.js"
      - "docs/EVIDENCE_MIGRATION.md"
      - "independent/vectors/archive-v1/**"
      - "runtime/evidenceArchive.js"
      - "runtime/evidenceRenewal.js"
      - "docs/EVIDENCE_ARCHIVE.md"
      - "runtime/evidenceCapsule.js"
      - "docs/EVIDENCE_CAPSULE.md"
      - ".github/workflows/python-wire-runtime.yml"

permissions:
  contents: read

jobs:
  cross-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify reference-produced artifacts with standalone Python
        run: node scripts/check-python-wire-runtime.mjs
      - name: Install Python Ed25519 verifier dependency
        run: python -m pip install 'cryptography>=42,<51'
      - name: Verify evidence capsules across JavaScript and Python
        run: node scripts/check-evidence-capsule-python.mjs
      - name: Check fixed archive wire bytes and digests
        run: node scripts/check-evidence-archive-vector.mjs
      - name: Verify archives and renewal witnesses across JavaScript and Python
        run: node scripts/check-evidence-archive-python.mjs
      - name: Verify fixed archive vector with Python
        run: python independent/python/verify_evidence_archive.py independent/vectors/archive-v1/archive.json independent/vectors/archive-v1/trusted-policy.json
      - name: Check fixed migration handoff bytes and digests
        run: node scripts/check-evidence-migration-vector.mjs
      - name: Verify migration and recovery across JavaScript and Python
        run: node scripts/check-evidence-migration-python.mjs
