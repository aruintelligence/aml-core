      - "scripts/evidence-drill-html.mjs"
      - "test/evidence-drill-html.test.js"
      - "docs/EVIDENCE_DRILL.md"
      - "independent/vectors/archive-v1/**"
      - "runtime/evidenceArchive.js"
      - "runtime/evidenceRenewal.js"
      - "docs/EVIDENCE_ARCHIVE.md"
      - "runtime/evidenceCapsule.js"
      - "docs/EVIDENCE_CAPSULE.md"
      - ".github/workflows/python-wire-runtime.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cross-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify reference-produced artifacts with standalone Python
        run: node scripts/check-python-wire-runtime.mjs > "${RUNNER_TEMP}/aml-wire-envelope-cross-runtime.json"
      - name: Upload wire envelope comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: aml-wire-envelope-cross-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/aml-wire-envelope-cross-runtime.json
          if-no-files-found: error
          retention-days: 30
      - name: Install Python Ed25519 verifier dependency
        run: python -m pip install 'cryptography>=42,<51'
      - name: Verify evidence capsules across JavaScript and Python
        run: node scripts/check-evidence-capsule-python.mjs > "${RUNNER_TEMP}/aml-capsule-cross-runtime.json"
      - name: Upload capsule comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: aml-capsule-cross-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/aml-capsule-cross-runtime.json
          if-no-files-found: error
          retention-days: 30
      - name: Check fixed archive wire bytes and digests
        run: node scripts/check-evidence-archive-vector.mjs
      - name: Verify archives and renewal witnesses across JavaScript and Python
        run: node scripts/check-evidence-archive-python.mjs
      - name: Verify fixed archive vector with Python
        run: python independent/python/verify_evidence_archive.py independent/vectors/archive-v1/archive.json independent/vectors/archive-v1/trusted-policy.json --diagnostic-only
      - name: Check fixed migration handoff bytes and digests
        run: node scripts/check-evidence-migration-vector.mjs
      - name: Verify migration and recovery across JavaScript and Python
        run: node scripts/check-evidence-migration-python.mjs
      - name: Check fixed cold storage share bytes and digests
        run: node scripts/check-evidence-shards-vector.mjs
      - name: Recover cold storage shares across JavaScript and Python
        run: node scripts/check-evidence-shards-python.mjs
      - name: Compare deterministic recovery drill reports across runtimes
        run: node scripts/check-evidence-drill-python.mjs
      - name: Rebuild and rehearse missing shares across runtimes
        run: node scripts/check-evidence-repair-python.mjs
      - name: Verify deterministic repair records across runtimes
        run: node scripts/check-evidence-repair-record-python.mjs
      - name: Simulate declared common failures across runtimes
        run: node scripts/check-evidence-placement-python.mjs
