      - "independent/vectors/repair-record-v1/**"
      - "runtime/evidenceRepairRecord.js"
      - "scripts/evidence-repair-record.mjs"
      - "independent/python/evidence_placement.py"
      - "scripts/check-evidence-placement-python.mjs"
      - "independent/vectors/placement-v1/**"
      - "runtime/evidencePlacement.js"
      - "scripts/evidence-placement.mjs"
      - "docs/EVIDENCE_PLACEMENT.md"
      - "docs/resilience-lab.html"
      - "test/resilience-lab.test.js"
      - "scripts/check-evidence-shards-python.mjs"
      - "scripts/check-evidence-shards-vector.mjs"
