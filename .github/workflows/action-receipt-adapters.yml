name: Action receipt adapters

on:
  push:
    branches: [main]
    paths:
      - "pilots/action-boundary/receipt-adapters.mjs"
      - "scripts/build-action-receipt-adapters-report.mjs"
      - "docs/action-receipt-adapters-report.json"
      - "scripts/build-action-revocation-report.mjs"
      - "docs/action-receipt-revocation-report.json"
      - "scripts/build-action-epoch-report.mjs"
      - "docs/action-receipt-policy-epoch-report.json"
      - "test/action-receipt-adapters.test.js"
      - ".github/workflows/action-receipt-adapters.yml"
  pull_request:
    paths:
      - "pilots/action-boundary/receipt-adapters.mjs"
      - "scripts/build-action-receipt-adapters-report.mjs"
      - "docs/action-receipt-adapters-report.json"
      - "scripts/build-action-revocation-report.mjs"
      - "docs/action-receipt-revocation-report.json"
      - "scripts/build-action-epoch-report.mjs"
      - "docs/action-receipt-policy-epoch-report.json"
      - "test/action-receipt-adapters.test.js"
      - ".github/workflows/action-receipt-adapters.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - run: node scripts/build-action-receipt-adapters-report.mjs --check
      - run: node scripts/build-action-revocation-report.mjs --check
      - run: node scripts/build-action-epoch-report.mjs --check
      - run: node --test test/action-receipt-adapters.test.js
