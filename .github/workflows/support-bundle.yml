name: AML Support Bundle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  support-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate deterministic support bundle
        run: node bin/aml-support-bundle.js "${RUNNER_TEMP}/aml-support-bundle.json"
      - name: Upload support bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: aml-support-bundle
          path: ${{ runner.temp }}/aml-support-bundle.json
