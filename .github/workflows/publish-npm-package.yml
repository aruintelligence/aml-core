name: Publish AML npm Package

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PUBLISH STABLE AML to confirm registry publication"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-production
    steps:
      - name: Check out release control plane
        uses: actions/checkout@v4
        with:
          path: control
          fetch-depth: 0

      - name: Set up Node.js registry
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve canonical stable release
        id: stable
        shell: bash
        run: |
          set -euo pipefail
          cd control
          STABLE_VERSION="$(node -p "require('./project-contract.json').release.stableVersion")"
          STABLE_TAG="$(node -p "require('./project-contract.json').release.stableTag")"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          REPOSITORY="$(node -p "require('./package.json').repository.url")"
          HOMEPAGE="$(node -p "require('./package.json').homepage")"
          BUGS_URL="$(node -p "require('./package.json').bugs.url")"
          [[ "$STABLE_TAG" == "v$STABLE_VERSION" ]] || { echo "Stable tag/version contract mismatch" >&2; exit 1; }
          [[ "$PACKAGE_VERSION" == "$STABLE_VERSION" ]] || { echo "Control-plane package version mismatch" >&2; exit 1; }
          [[ "${{ inputs.confirm }}" == "PUBLISH STABLE AML" ]] || { echo "Manual publication confirmation did not match exactly" >&2; exit 1; }
          echo "version=$STABLE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$STABLE_TAG" >> "$GITHUB_OUTPUT"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "homepage=$HOMEPAGE" >> "$GITHUB_OUTPUT"
          echo "bugs_url=$BUGS_URL" >> "$GITHUB_OUTPUT"

      - name: Check out immutable stable source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.stable.outputs.tag }}
          path: release-src
          fetch-depth: 1

      - name: Verify stable code identity
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="$(node -p "require('./release-src/package.json').version")"
          RELEASE_NAME="$(node -p "require('./release-src/package.json').name")"
          [[ "$RELEASE_VERSION" == "${{ steps.stable.outputs.version }}" ]] || { echo "Stable tag package version mismatch" >&2; exit 1; }
          [[ "$RELEASE_NAME" == "${{ steps.stable.outputs.package_name }}" ]] || { echo "Stable tag package name mismatch" >&2; exit 1; }

      - name: Apply deterministic npm metadata overlay
        shell: bash
        run: |
          set -euo pipefail
          cp release-src/package.json release-src/package.original.json
          node <<'NODE'
          const fs = require('fs');
          const file = 'release-src/package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          pkg.repository = { type: 'git', url: '${{ steps.stable.outputs.repository }}' };
          pkg.homepage = '${{ steps.stable.outputs.homepage }}';
          pkg.bugs = { url: '${{ steps.stable.outputs.bugs_url }}' };
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Prove overlay changed only distribution metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync('release-src/package.original.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('release-src/package.json', 'utf8'));
          for (const key of ['repository', 'homepage', 'bugs']) {
            delete before[key];
            delete after[key];
          }
          if (JSON.stringify(before) !== JSON.stringify(after)) {
            console.error('Registry metadata overlay changed package contract fields outside repository/homepage/bugs');
            process.exit(1);
          }
          NODE
          rm release-src/package.original.json

      - name: Build stable registry tarball
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cd release-src
          npm install --ignore-scripts
          npm pack --json --pack-destination ../artifact > ../pack.json
          cd ..
          echo "filename=$(node -p "require('./pack.json')[0].filename")" >> "$GITHUB_OUTPUT"
          echo "integrity=$(node -p "require('./pack.json')[0].integrity")" >> "$GITHUB_OUTPUT"
          echo "shasum=$(node -p "require('./pack.json')[0].shasum")" >> "$GITHUB_OUTPUT"

      - name: Reject obvious secret material in tarball
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="artifact/${{ steps.pack.outputs.filename }}"
          tar -tzf "$TARBALL" > package-files.txt
          if grep -Eiq '(^|/)(\.env($|\.)|.*private[-_. ]?key|id_(rsa|ed25519)(\.|$)|.*\.(p12|pfx|key)$|\.npmrc$|secrets?(/|$))' package-files.txt; then
            echo "Potential secret/private-key path found in stable package tarball" >&2
            grep -Ei '(^|/)(\.env($|\.)|.*private[-_. ]?key|id_(rsa|ed25519)(\.|$)|.*\.(p12|pfx|key)$|\.npmrc$|secrets?(/|$))' package-files.txt >&2 || true
            exit 1
          fi

      - name: Clean-install stable registry artifact before publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir consumer
          printf '{"private":true,"type":"module"}\n' > consumer/package.json
          cd consumer
          npm install --ignore-scripts "../artifact/${{ steps.pack.outputs.filename }}"
          node -e "import('${{ steps.stable.outputs.package_name }}').then(m=>{if(!m)process.exit(2)}).catch(e=>{console.error(e);process.exit(1)})"
          ./node_modules/.bin/aml validate ../control/examples/simple.aml

      - name: Require canonical or unclaimed npm identity
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME="${{ steps.stable.outputs.package_name }}"
          EXPECTED_REPO="${{ steps.stable.outputs.repository }}"
          if npm view "$PACKAGE_NAME" name >/dev/null 2>&1; then
            EXISTING_REPO="$(npm view "$PACKAGE_NAME" repository.url 2>/dev/null || true)"
            if [[ "$EXISTING_REPO" != "$EXPECTED_REPO" ]]; then
              echo "npm identity collision: $PACKAGE_NAME points to $EXISTING_REPO, expected $EXPECTED_REPO" >&2
              exit 1
            fi
            if npm view "$PACKAGE_NAME@${{ steps.stable.outputs.version }}" version >/dev/null 2>&1; then
              echo "npm version $PACKAGE_NAME@${{ steps.stable.outputs.version }} already exists; refusing republish" >&2
              exit 1
            fi
          else
            echo "npm identity $PACKAGE_NAME is currently unclaimed; proceeding with intentional first publication."
          fi

      - name: Require npm publishing credential
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NPM_TOKEN is not configured for npm-production; publication cannot proceed." >&2
            exit 1
          fi
          npm whoami

      - name: Publish stable registry artifact with provenance
        working-directory: release-src
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance --tag latest

      - name: Wait for exact registry version and metadata
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="${{ steps.stable.outputs.package_name }}@${{ steps.stable.outputs.version }}"
          for attempt in 1 2 3 4 5 6 7 8; do
            FOUND="$(npm view "$PACKAGE" version 2>/dev/null || true)"
            FOUND_REPO="$(npm view "$PACKAGE" repository.url 2>/dev/null || true)"
            if [[ "$FOUND" == "${{ steps.stable.outputs.version }}" && "$FOUND_REPO" == "${{ steps.stable.outputs.repository }}" ]]; then
              echo "Published and visible with canonical repository metadata: $PACKAGE"
              exit 0
            fi
            sleep 5
          done
          echo "Registry verification did not observe the expected version/repository metadata for $PACKAGE" >&2
          exit 1

      - name: Clean-install exact package from public npm registry
        shell: bash
        run: |
          set -euo pipefail
          rm -rf registry-consumer
          mkdir registry-consumer
          printf '{"private":true,"type":"module"}\n' > registry-consumer/package.json
          cd registry-consumer
          npm install --ignore-scripts --save-exact "${{ steps.stable.outputs.package_name }}@${{ steps.stable.outputs.version }}"
          node -e "import('${{ steps.stable.outputs.package_name }}').then(m=>{if(!m||Object.keys(m).length===0)process.exit(2);console.log('API import OK')}).catch(e=>{console.error(e);process.exit(1)})"
          ./node_modules/.bin/aml version
          ./node_modules/.bin/aml validate ../control/examples/simple.aml

      - name: Capture publication evidence
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="${{ steps.stable.outputs.package_name }}@${{ steps.stable.outputs.version }}"
          REGISTRY_VERSION="$(npm view "$PACKAGE" version)"
          REGISTRY_REPO="$(npm view "$PACKAGE" repository.url)"
          REGISTRY_INTEGRITY="$(npm view "$PACKAGE" dist.integrity)"
          REGISTRY_SHASUM="$(npm view "$PACKAGE" dist.shasum)"
          REGISTRY_TARBALL="$(npm view "$PACKAGE" dist.tarball)"
          node <<'NODE'
          const fs = require('fs');
          const evidence = {
            protocol: 'aml-npm-publication-evidence/1',
            package: '${{ steps.stable.outputs.package_name }}',
            version: '${{ steps.stable.outputs.version }}',
            stable_tag: '${{ steps.stable.outputs.tag }}',
            repository: process.env.REGISTRY_REPO,
            registry_version: process.env.REGISTRY_VERSION,
            registry_integrity: process.env.REGISTRY_INTEGRITY,
            registry_shasum: process.env.REGISTRY_SHASUM,
            registry_tarball: process.env.REGISTRY_TARBALL,
            prepublish_pack_integrity: '${{ steps.pack.outputs.integrity }}',
            prepublish_pack_shasum: '${{ steps.pack.outputs.shasum }}',
            github_repository: '${{ github.repository }}',
            workflow_run_id: '${{ github.run_id }}',
            control_plane_sha: '${{ github.sha }}',
            public_registry_clean_install: true,
            api_import_smoke_test: true,
            cli_version_smoke_test: true,
            cli_validate_smoke_test: true,
            claim_boundary: 'Project-generated release evidence; not independent external verification.'
          };
          fs.mkdirSync('publication-evidence', { recursive: true });
          fs.writeFileSync('publication-evidence/npm-publication-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
          NODE
        env:
          REGISTRY_VERSION: ${{ steps.stable.outputs.version }}
          REGISTRY_REPO: ${{ steps.stable.outputs.repository }}
          REGISTRY_INTEGRITY: ${{ steps.pack.outputs.integrity }}
          REGISTRY_SHASUM: ${{ steps.pack.outputs.shasum }}
          REGISTRY_TARBALL: https://registry.npmjs.org/${{ steps.stable.outputs.package_name }}/-/${{ steps.pack.outputs.filename }}

      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: aml-npm-publication-evidence-${{ steps.stable.outputs.version }}-${{ github.run_id }}
          path: publication-evidence/npm-publication-evidence.json
          if-no-files-found: error
          retention-days: 90
