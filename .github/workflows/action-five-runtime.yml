name: Five-runtime action matrix

on:
  push:
    branches: [main]
    paths:
      - "pilots/action-boundary/perl_boundary.pl"
      - "pilots/action-boundary/openssl_python_boundary.py"
      - "docs/action-webcrypto-boundary.js"
      - "docs/action-browser-*"
      - "docs/action-five-runtime-report.json"
      - "scripts/build-action-five-runtime-report.mjs"
      - "test/action-five-runtime.test.js"
      - ".github/workflows/action-five-runtime.yml"
  pull_request:
    paths:
      - "pilots/action-boundary/perl_boundary.pl"
      - "pilots/action-boundary/openssl_python_boundary.py"
      - "docs/action-webcrypto-boundary.js"
      - "docs/action-browser-*"
      - "docs/action-five-runtime-report.json"
      - "scripts/build-action-five-runtime-report.mjs"
      - "test/action-five-runtime.test.js"
      - ".github/workflows/action-five-runtime.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Replay the full corpus in five runtimes
        run: node scripts/build-action-five-runtime-report.mjs --check
      - name: Verify provenance and browser fixture pin
        run: node --test test/action-five-runtime.test.js
