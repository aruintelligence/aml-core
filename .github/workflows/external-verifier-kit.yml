name: AML External Verifier Kit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verifier-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
      - name: Build reference-code-free verifier kit
        run: node scripts/build-external-verifier-kit.mjs
      - name: Verify kit integrity and code exclusion
        run: node scripts/check-external-verifier-kit.mjs --diagnostic-only
      - name: Upload exact verifier kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: aml-external-verifier-kit-${{ github.sha }}
          path: dist/external-verifier-kit/
          if-no-files-found: error
          retention-days: 30
