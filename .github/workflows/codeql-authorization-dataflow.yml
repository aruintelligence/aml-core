name: AML Authorization Data-Flow (CodeQL)

# Directive 010: no success outcome may depend on a verification field
# (valid / verified / accepted / quorum_met / official ...) unless an explicit
# `authorized` decision controls the same outcome. Custom queries live in
# tooling/codeql/{javascript,python,go}. Zero suppressions: no query filters,
# no source suppression comments (the gate refuses them), every alert printed.
on:
  push:
    branches:
      - main
      - operation-aml/grant-store-integrity-20261104
  pull_request:
    branches:
      - main
      - operation-aml/grant-store-integrity-20261104
    types: [opened, synchronize, reopened, ready_for_review, edited]
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authorization-dataflow:
    name: Authorization data-flow queries (JavaScript, Python, Go)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CODEQL_EXTRACTOR_JAVASCRIPT_ALLOW_MINIFIED_FILES: "true"
    steps:
      - name: Check out candidate without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
      - name: Set up Go for the Go fixtures and independent/go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: independent/go/go.mod
          cache: false
      - name: Enforce no-debug disclosure policy before scanner initialization
        run: node scripts/check-codeql-no-debug.mjs
      # Used only to provision the pinned CodeQL CLI; no analyze/upload step.
      - name: Provision the pinned CodeQL CLI
        id: codeql-init
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: javascript-typescript
          build-mode: none
          tools: linked
          debug: false
          db-location: ${{ runner.temp }}/aml-codeql-provision-db
          dependency-caching: none
          trap-caching: false
      - name: Seeded bypass corpus must be fully flagged, controls clean
        env:
          CODEQL_CLI: ${{ steps.codeql-init.outputs.codeql-path }}
        run: node scripts/check-authorization-dataflow.mjs
      - name: Repository scan, gated on the reviewed-alert inventory (new or stale alerts fail)
        env:
          CODEQL_CLI: ${{ steps.codeql-init.outputs.codeql-path }}
          GOFLAGS: -mod=mod
        run: node scripts/check-authorization-dataflow.mjs --repo-gate audit/AML_AUTHZ_DATAFLOW_REVIEW.json
