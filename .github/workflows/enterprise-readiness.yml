name: AML Enterprise Readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  enterprise-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python signature verification dependency
        run: python -m pip install 'cryptography>=42,<51'
      - name: Verify protected API surface
        run: npm run api:stability
      - name: Verify upgrade contract
        run: npm run upgrade:check
      - name: Generate CycloneDX SBOM
        run: node scripts/generate-sbom.mjs "${RUNNER_TEMP}/aml-core.cdx.json"
      - name: Validate generated SBOM shape
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = `${process.env.RUNNER_TEMP}/aml-core.cdx.json`;
          const sbom = JSON.parse(fs.readFileSync(p,'utf8'));
          if (sbom.bomFormat !== 'CycloneDX' || sbom.specVersion !== '1.5') process.exit(1);
          if (sbom.metadata?.component?.name !== 'aml-core') process.exit(2);
          console.log(JSON.stringify({protocol:'aml-sbom-verification/1',valid:true,component:sbom.metadata.component.name,version:sbom.metadata.component.version,components:sbom.components.length},null,2));
          NODE
      - name: Run enterprise decision pilot
        run: node pilots/enterprise-30min/run.mjs > "${RUNNER_TEMP}/aml-enterprise-pilot.json"
      - name: Replay and verify enterprise pilot report
        run: node pilots/enterprise-30min/verify-report.mjs "${RUNNER_TEMP}/aml-enterprise-pilot.json"
      - name: Exercise locked HTTP host render gate
        run: node pilots/enterprise-http-gate/run.mjs > "${RUNNER_TEMP}/aml-enterprise-http-gate.json"
      - name: Challenge signed gate with altered HTTP responses
        run: node pilots/enterprise-http-gate/adversarial.mjs --seed 0123456789abcdef0123456789abcdef > "${RUNNER_TEMP}/aml-signed-gate-adversarial.json"
      - name: Verify captured locked HTTP responses in Python
        run: node scripts/check-http-exchange-python.mjs > "${RUNNER_TEMP}/aml-locked-http-python.json"
      - name: Exercise localhost screen host and suppression
        run: node --test test/enterprise-screen.test.js
      - name: Upload enterprise pilot evidence
        uses: actions/upload-artifact@v4
        with:
          name: aml-enterprise-pilot-${{ github.sha }}
          path: ${{ runner.temp }}/aml-enterprise-pilot.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload local HTTP gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: aml-enterprise-http-gate-${{ github.sha }}
          path: ${{ runner.temp }}/aml-enterprise-http-gate.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload adversarial gate comparison
        uses: actions/upload-artifact@v4
        with:
          name: aml-signed-gate-adversarial-${{ github.sha }}
          path: ${{ runner.temp }}/aml-signed-gate-adversarial.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload cross-runtime HTTP verification report
        uses: actions/upload-artifact@v4
        with:
          name: aml-locked-http-python-${{ github.sha }}
          path: ${{ runner.temp }}/aml-locked-http-python.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: aml-core-cyclonedx-sbom-${{ github.sha }}
          path: ${{ runner.temp }}/aml-core.cdx.json
          if-no-files-found: error
          retention-days: 90
