name: Controlled site action pilots

on:
  push:
    branches: [main]
    paths:
      - "pilots/action-boundary/controlled-sites.json"
      - "scripts/build-controlled-pilot-pages.mjs"
      - "docs/action-pilots/**"
      - "scripts/build-action-site-browser-receipts.mjs"
      - "test/action-site-browser-evidence.test.js"
      - ".github/workflows/action-site-pilots.yml"
  pull_request:
    paths:
      - "pilots/action-boundary/controlled-sites.json"
      - "scripts/build-controlled-pilot-pages.mjs"
      - "docs/action-pilots/**"
      - "scripts/build-action-site-browser-receipts.mjs"
      - "test/action-site-browser-evidence.test.js"
      - ".github/workflows/action-site-pilots.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/build-controlled-pilot-pages.mjs --check-before
      - run: |
          if test -f docs/action-pilots/after/01-support-hours.html; then
            node scripts/build-controlled-pilot-pages.mjs --check-after
            node scripts/dispatch-controlled-pilot-pages.mjs --check
            node --test test/action-controlled-site-pilots.test.js
          fi
      - run: |
          if test -f docs/action-pilots/evidence/browser-receipts.jsonl; then
            node scripts/build-action-site-browser-receipts.mjs --check
            node --test test/action-site-browser-evidence.test.js
          fi
