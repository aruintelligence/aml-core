name: Action boundary reproduction package

on:
  push:
    branches: [main]
    paths:
      - "reproduction/action-boundary/**"
      - "scripts/build-action-release-manifest.mjs"
      - ".github/workflows/action-boundary-reproduction.yml"
  pull_request:
    paths:
      - "reproduction/action-boundary/**"
      - "scripts/build-action-release-manifest.mjs"
      - ".github/workflows/action-boundary-reproduction.yml"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check development branch stress matrix and guarded adapter
        env:
          AML_ACTION_STRESS_CHILD_TIMEOUT_MS: "20000"
        run: |
          node scripts/build-action-stress-matrix.mjs --check
          node --test test/action-boundary-guarded-tool.test.js test/action-five-runtime.test.js
      - uses: actions/checkout@v4
        with:
          ref: 79a24ba96820a4ca974bcba30b797bf35dd7abc7
          path: release-snapshot
          persist-credentials: false
      - name: Reproduce pinned release evidence and manifest
        run: bash release-snapshot/reproduction/action-boundary/reproduce.sh
