<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Declared resource versus actual recipient</title>
  <desc id="desc">A local ĀML target binding experiment: an approved declared resource contains a different recipient in tool arguments. The reference callback count is one; the host-bound count is zero.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07131d"/><stop offset="1" stop-color="#153e4b"/></linearGradient><linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#163443"/><stop offset="1" stop-color="#112638"/></linearGradient></defs>
  <rect width="1200" height="630" fill="url(#bg)"/><circle cx="1050" cy="80" r="320" fill="#2a8584" opacity=".13"/><circle cx="45" cy="570" r="300" fill="#5273b3" opacity=".10"/>
  <text x="62" y="69" fill="#8ce5e5" font-family="monospace" font-size="19" font-weight="bold" letter-spacing="3">ĀML™ / TARGET BINDING LAB</text>
  <text x="61" y="176" fill="#f2f8f8" font-family="Arial,sans-serif" font-size="78" font-weight="bold">Declared </text><text x="410" y="176" fill="#f6d080" font-family="Arial,sans-serif" font-size="78" font-weight="bold">≠</text><text x="494" y="176" fill="#f2f8f8" font-family="Arial,sans-serif" font-size="78" font-weight="bold"> actual.</text>
  <text x="63" y="220" fill="#cbdde3" font-family="Arial,sans-serif" font-size="24">One forged recipient. Same policy rule. A host-owned check before dispatch.</text>
  <rect x="62" y="267" width="507" height="138" rx="16" fill="url(#panel)" stroke="#63909b" stroke-width="2"/><text x="85" y="305" fill="#a9c9d2" font-family="monospace" font-size="17">DECLARED POLICY RESOURCE</text><text x="85" y="357" fill="#f2f8f8" font-family="monospace" font-weight="bold" font-size="27">team@example.test</text>
  <rect x="631" y="267" width="507" height="138" rx="16" fill="#332937" stroke="#ce7581" stroke-width="2"/><text x="654" y="305" fill="#e2b4bd" font-family="monospace" font-size="17">RECIPIENT IN TOOL ARGUMENTS</text><text x="654" y="357" fill="#ff939a" font-family="monospace" font-weight="bold" font-size="27">outside@example.test</text>
  <path d="M570 337h60" stroke="#8ce5e5" stroke-width="4"/><path d="m619 326 12 11-12 11" fill="none" stroke="#8ce5e5" stroke-width="4"/>
  <rect x="62" y="448" width="507" height="104" rx="15" fill="#3b342d" stroke="#b69665" stroke-width="2"/><text x="84" y="485" fill="#f6d080" font-family="monospace" font-size="17">DECLARED-RULE PATH</text><text x="84" y="527" fill="#f6d080" font-family="Arial,sans-serif" font-weight="bold" font-size="30">1 simulated callback</text>
  <rect x="631" y="448" width="507" height="104" rx="15" fill="#1d423c" stroke="#80b997" stroke-width="2"/><text x="653" y="485" fill="#a4edb9" font-family="monospace" font-size="17">HOST TARGET-BOUND PATH</text><text x="653" y="527" fill="#a4edb9" font-family="Arial,sans-serif" font-weight="bold" font-size="30">0 callbacks · BLOCK</text>
  <text x="62" y="601" fill="#b6ccd4" font-family="Arial,sans-serif" font-size="17">Project-authored local simulation · no message sent · inspect all seven executable cases</text>
</svg>
