<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">One A2UI function call ID used twice: before two callbacks, after one</title>
  <desc id="desc">A pinned historical AML bridge allowed both replayed calls with the same functionCallId to reach a simulated callback. A host-owned invocation claim lets only the first through.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#173749"/><stop offset="1" stop-color="#07131e"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="15" stdDeviation="16" flood-color="#000" flood-opacity=".35"/></filter></defs>
  <rect width="1200" height="560" fill="url(#bg)"/>
  <circle cx="1074" cy="60" r="193" stroke="#7ee9e8" stroke-opacity=".17" fill="none"/><circle cx="1074" cy="60" r="135" stroke="#7ee9e8" stroke-opacity=".14" fill="none"/>
  <text x="60" y="52" fill="#7ee9e8" font-family="monospace" font-size="18" font-weight="700" letter-spacing="3">ĀML / PINNED A2UI REPLAY COUNTEREXAMPLE</text>
  <text x="60" y="111" fill="#f0fafa" font-family="system-ui,sans-serif" font-size="47" font-weight="800" letter-spacing="-2">One functionCallId.</text>
  <text x="60" y="165" fill="#ffa18f" font-family="system-ui,sans-serif" font-size="47" font-weight="800" letter-spacing="-2">Two callbacks before the fix.</text>
  <text x="60" y="203" fill="#b6ced7" font-family="system-ui,sans-serif" font-size="17">Same trusted host session · same agent-provided invocation ID · local simulated callback</text>
  <g filter="url(#shadow)"><rect x="60" y="244" width="520" height="236" rx="20" fill="#162b38" stroke="#ffa18f"/><rect x="620" y="244" width="520" height="236" rx="20" fill="#162f37" stroke="#b8f18d"/></g>
  <text x="88" y="283" fill="#ffa18f" font-family="monospace" font-size="16" font-weight="700">PRIOR MODULE / NO ID CLAIM</text>
  <text x="648" y="283" fill="#b8f18d" font-family="monospace" font-size="16" font-weight="700">CORRECTED MODULE / HOST CLAIM</text>
  <text x="88" y="338" fill="#fff8f5" font-family="monospace" font-size="33" font-weight="800">2 callbacks</text>
  <text x="648" y="338" fill="#f0fff0" font-family="monospace" font-size="33" font-weight="800">1 callback</text>
  <rect x="88" y="365" width="462" height="35" rx="8" fill="#ffa18f" opacity=".9"/>
  <rect x="648" y="365" width="231" height="35" rx="8" fill="#b8f18d" opacity=".95"/>
  <text x="88" y="435" fill="#d2e1e4" font-family="system-ui,sans-serif" font-size="16">First and replay both reached the callback.</text>
  <text x="648" y="435" fill="#d2e1e4" font-family="system-ui,sans-serif" font-size="16">Replay rejected before approval or dispatch.</text>
  <text x="60" y="531" fill="#97b5c1" font-family="system-ui,sans-serif" font-size="13">Six historical/current scenarios · process-local claim prototype · no live external action · A2UI v1.0 candidate</text>
</svg>
