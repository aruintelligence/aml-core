<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">One proposal, two hashes: a cross-runtime mismatch found and fixed</title>
  <desc id="desc">The keys 10 and 2 had different JSON ordering in the prior Python code and JavaScript. The corrected Python path now matches JavaScript's numeric index ordering.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#16284b"/><stop offset="1" stop-color="#0a1729"/></linearGradient>
    <linearGradient id="accent" x2="1"><stop stop-color="#8ceaf0"/><stop offset="1" stop-color="#cdb8ff"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="36"/></filter>
  </defs>
  <rect width="1200" height="480" rx="27" fill="url(#bg)"/>
  <circle cx="75" cy="80" r="130" fill="#1a9db0" opacity=".2" filter="url(#soft)"/>
  <circle cx="1100" cy="420" r="170" fill="#7771e6" opacity=".18" filter="url(#soft)"/>
  <g font-family="system-ui,Segoe UI,sans-serif">
    <text x="58" y="69" fill="#8ceaf0" font-size="15" font-weight="800" letter-spacing="4">ĀML / ENGINEERING PROOF 022</text>
    <text x="58" y="124" fill="#f3f8ff" font-size="45" font-weight="850" letter-spacing="-2">One action. Two hashes.</text>
    <text x="58" y="163" fill="#c6d7e9" font-size="20">A real JavaScript ↔ Python byte mismatch, found and repaired.</text>
    <rect x="58" y="216" width="500" height="145" rx="18" fill="#35243d" stroke="#c17997"/>
    <text x="84" y="251" fill="#ffb5c5" font-size="13" font-weight="800" letter-spacing="2">BEFORE / DIVERGENT BYTES</text>
    <text x="84" y="290" fill="#fff0f4" font-size="20" font-family="ui-monospace,monospace">Python  {"10":"ten","2":"two"}</text>
    <text x="84" y="324" fill="#fff0f4" font-size="20" font-family="ui-monospace,monospace">JS      {"2":"two","10":"ten"}</text>
    <rect x="638" y="216" width="504" height="145" rx="18" fill="#173b3f" stroke="#63cbbd"/>
    <text x="664" y="251" fill="#9df3d4" font-size="13" font-weight="800" letter-spacing="2">AFTER / EXACT AGREEMENT</text>
    <text x="664" y="290" fill="#e7fff5" font-size="20" font-family="ui-monospace,monospace">Python  {"2":"two","10":"ten"}</text>
    <text x="664" y="324" fill="#e7fff5" font-size="20" font-family="ui-monospace,monospace">JS      {"2":"two","10":"ten"}</text>
    <path d="M575 283 H622" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <path d="M615 274 L628 283 L615 292" fill="none" stroke="#b6dff3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="413" fill="#f2cf92" font-size="24" font-weight="800">439 mismatches → 0</text>
    <text x="359" y="413" fill="#c3d5e8" font-size="17">in 519 deliberately adversarial project-generated cases</text>
    <text x="58" y="445" fill="#aebfd0" font-size="14">This is a bounded regression result, not universal JSON interoperability or outside validation.</text>
  </g>
</svg>
