    <text x="744" y="313" fill="#f1f7ff" font-size="29" font-weight="800">13 / 13</text>
    <text x="744" y="348" fill="#bfcce7" font-size="17">plan · receipt · callback · proposal</text>
    <circle cx="600" cy="301" r="53" fill="#263651" stroke="#eacb87" stroke-width="2"/>
    <text x="600" y="314" text-anchor="middle" fill="#f6dca0" font-size="41" font-weight="800">=</text>
