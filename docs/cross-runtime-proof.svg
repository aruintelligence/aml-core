<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">JavaScript and Python: 13 exact matches on the ĀML action challenge</title>
  <desc id="desc">Two project-maintained implementations receive the same 13 proposed-action cases. Their plans, dispatch receipts, callback counts, and executed proposals match on this published fixture set.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090f25"/><stop offset=".52" stop-color="#152546"/><stop offset="1" stop-color="#0a1d2f"/></linearGradient><linearGradient id="accent" x2="1"><stop stop-color="#7de8f4"/><stop offset="1" stop-color="#ccb1ff"/></linearGradient></defs>
  <rect width="1200" height="480" rx="28" fill="url(#bg)"/>
  <text x="54" y="61" fill="#81e8f4" font-family="Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="4">ĀML™ / CROSS-RUNTIME CHALLENGE</text>
  <text x="54" y="123" fill="#f6f8ff" font-family="Arial,sans-serif" font-size="43" font-weight="800">TWO LANGUAGES.</text>
  <text x="54" y="170" fill="url(#accent)" font-family="Arial,sans-serif" font-size="43" font-weight="800">SAME 13 DECISIONS.</text>
