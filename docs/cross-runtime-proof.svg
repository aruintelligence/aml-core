    <rect x="54" y="220" width="430" height="162" rx="20" fill="#10273e" stroke="#4f9daf"/>
    <text x="82" y="260" fill="#94e6f0" font-size="18" font-weight="800" letter-spacing="2">JAVASCRIPT</text>
