<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The invisible second recipient</title>
  <desc id="desc">An approved To address and an unapproved BCC address are compared. A to-only mapper reaches one simulated callback; a complete recipient manifest blocks before a callback.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#173d58"/></linearGradient><linearGradient id="card" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#173d4e"/><stop offset="1" stop-color="#171f3a"/></linearGradient></defs>
  <rect width="1200" height="630" fill="url(#bg)"/><circle cx="1130" cy="80" r="310" fill="#4b9bba" opacity=".12"/><circle cx="60" cy="600" r="325" fill="#4d559b" opacity=".12"/>
  <text x="62" y="68" fill="#83e6eb" font-family="monospace" font-size="19" font-weight="bold" letter-spacing="3">ĀML™ / RECIPIENT MANIFEST</text>
  <text x="61" y="154" fill="#f5f9fa" font-family="Arial,sans-serif" font-size="68" font-weight="bold">The invisible</text><text x="61" y="224" fill="#ff919f" font-family="Arial,sans-serif" font-size="68" font-weight="bold">second recipient.</text>
  <text x="64" y="271" fill="#cbdde5" font-family="Arial,sans-serif" font-size="23">A to-only target check misses a new BCC. The full manifest sees it.</text>
  <rect x="62" y="312" width="450" height="205" rx="17" fill="url(#card)" stroke="#648ba4" stroke-width="2"/><text x="89" y="349" fill="#83e6eb" font-family="monospace" font-size="16">SIMULATED TOOL ARGUMENTS</text>
  <text x="89" y="390" fill="#b8cbd5" font-family="monospace" font-size="20">TO</text><text x="172" y="390" fill="#f5f9fa" font-family="monospace" font-size="20" font-weight="bold">team@example.test</text>
  <text x="89" y="430" fill="#b8cbd5" font-family="monospace" font-size="20">CC</text><text x="172" y="430" fill="#b8cbd5" font-family="monospace" font-size="20">none</text>
  <rect x="78" y="451" width="420" height="50" rx="9" fill="#442c3c"/><text x="89" y="485" fill="#ff919f" font-family="monospace" font-size="20">BCC</text><text x="172" y="485" fill="#ff919f" font-family="monospace" font-size="20" font-weight="bold">outside@example.test</text>
  <path d="M528 417h82" stroke="#83e6eb" stroke-width="4"/><path d="m594 405 14 12-14 12" fill="none" stroke="#83e6eb" stroke-width="4"/>
  <rect x="635" y="312" width="504" height="87" rx="14" fill="#3d342e" stroke="#b69a6b" stroke-width="2"/><text x="657" y="346" fill="#f4ce7c" font-family="monospace" font-size="17">TO-ONLY MAPPER</text><text x="657" y="382" fill="#f4ce7c" font-family="Arial,sans-serif" font-size="29" font-weight="bold">1 simulated callback</text>
  <rect x="635" y="428" width="504" height="89" rx="14" fill="#22443d" stroke="#80b999" stroke-width="2"/><text x="657" y="463" fill="#a6edbd" font-family="monospace" font-size="17">FULL TO / CC / BCC MANIFEST</text><text x="657" y="501" fill="#a6edbd" font-family="Arial,sans-serif" font-size="29" font-weight="bold">0 callbacks · BLOCK</text>
  <text x="62" y="592" fill="#b8cbd5" font-family="Arial,sans-serif" font-size="17">Seven executable local cases · no actual message sent · inspect the full report</text>
</svg>
