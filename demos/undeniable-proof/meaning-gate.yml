name: ĀML Proof Demo

on:
  push:
    paths:
      - "demos/undeniable-proof/**"
  pull_request:
    paths:
      - "demos/undeniable-proof/**"

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Compile proof fixture
        run: node bin/aml.js compile demos/undeniable-proof/after.aml /tmp/aml-proof
      - name: Verify repository tests
        run: npm test
